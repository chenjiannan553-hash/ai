name: 每日 AI 新闻简报（RSS 素材准备）

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-ai-news-rss
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Collect RSS news and prepare prompt material
        run: python scripts/daily_briefing.py
      - name: Commit RSS material (not an AI-generated summary)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/
          if git diff --cached --quiet; then
            echo "No report changes to commit."
          else
            git commit -m "Prepare daily AI news source material"
            git push
          fi
