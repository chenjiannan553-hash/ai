name: 每日 AI 新闻简报

on:
  schedule:
    - cron: "20 9 * * *" # 每天北京时间 17:20
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-ai-news
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache local model weights
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: qwen2.5-0.5b-instruct-q4km-v1
      - name: Install local inference dependencies
        run: pip install -r requirements.txt
      - name: Generate AI-written report
        run: python scripts/daily_briefing.py
      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/
          if git diff --cached --quiet; then
            echo "No report changes to commit."
          else
            git commit -m "Daily AI news briefing"
            git push
          fi
